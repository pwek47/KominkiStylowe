<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kominki Stylowe | Starachowice</title>

<style>

:root{
    --dark:#111;
    --blue:#003f6f;
    --gold:#c89b3c;
    --text:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:var(--blue);
    color:white;
}

.container{
    max-width:1400px;
    width:90%;
    margin:auto;
}

header{
    position:fixed;
    top:0;
    width:100%;
    z-index:1000;
    background:#111;
}

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 0;
}

.logo{
    font-size:28px;
    font-weight:700;
}

.menu{
    display:flex;
    gap:25px;
}

.menu a{
    color:white;
    text-decoration:none;
}

.contact{
    display:flex;
    gap:20px;
    font-size:14px;
}

.contact a{
    color:white;
    text-decoration:none;
}

.hero{
    min-height:100vh;
    background:url('images/hero.jpg');
    background-size:cover;
    background-position:center;
}

.overlay{
    min-height:100vh;
    background:rgba(0,0,0,.55);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    flex-direction:column;
}

.overlay h1{
    font-size:70px;
}

.overlay p{
    font-size:22px;
    margin-top:10px;
}

.buttons{
    margin-top:40px;
}

.btn{
    display:inline-block;
    margin:5px;
    text-decoration:none;
    color:white;
    background:var(--gold);
    padding:15px 35px;
    border-radius:6px;
}

section{
    padding:90px 0;
}

h2{
    text-align:center;
    font-size:42px;
    margin-bottom:50px;
}

.about{
    text-align:center;
    max-width:900px;
    margin:auto;
    font-size:20px;
    line-height:1.8;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    margin-top:50px;
}

.stat{
    background:#0b2742;
    padding:30px;
    text-align:center;
    border-radius:10px;
}

.stat h3{
    font-size:50px;
    color:var(--gold);
}

.realizations{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:30px;
}

.card{
    background:#102d49;
    border-radius:10px;
    overflow:hidden;
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card h3{
    padding:20px;
    text-align:center;
}

.partners{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:30px;
}

.partner{
    background:#161616;
    min-height:220px;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    font-weight:bold;
}

.contact-box{
    text-align:center;
    font-size:20px;
    line-height:2;
}

.contact-box a{
    color:white;
}

.map-btn{
    margin-top:20px;
    display:inline-block;
    padding:15px 30px;
    background:var(--gold);
    color:white;
    text-decoration:none;
    border-radius:5px;
}

footer{
    background:#111;
    text-align:center;
    padding:50px;
}

.phone{
    position:fixed;
    right:20px;
    bottom:20px;
    width:65px;
    height:65px;
    background:var(--gold);
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    text-decoration:none;
}

@media(max-width:900px){

    .navbar{
        flex-direction:column;
        gap:15px;
    }

    .contact{
        flex-wrap:wrap;
        justify-content:center;
    }

    .overlay h1{
        font-size:40px;
    }
}

</style>

</head>

<header>

<div class
